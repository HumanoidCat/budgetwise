# Prometheus — HU-16. Raspa las métricas del API cada 5 s.
global:
  scrape_interval: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: budgetwise-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: budgetwise-api
