name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check app tests alembic
      - name: Pruebas unitarias
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # npm ci y no npm install: instala exactamente lo que fija
      # package-lock.json y falla si el lock no concuerda con package.json.
      # Con npm install, el CI podía resolver versiones distintas a las de la
      # máquina de quien abrió el PR.
      - run: npm ci
      - name: Lint
        run: npm run lint --if-present
      # expo lint NO verifica tipos. Sin este paso, un estilo o una propiedad
      # que no existe pasa el CI y se descubre en pantalla.
      # Sin --if-present a propósito: si alguien borra el script, el CI tiene
      # que fallar y no seguir en verde sin revisar nada.
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas unitarias
        run: npm test --if-present -- --watchAll=false
        