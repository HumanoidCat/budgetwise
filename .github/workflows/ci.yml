name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check app tests alembic
      - name: Pruebas unitarias
        run: pytest --cov=app --cov-report=term-missing

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # npm ci y no npm install: instala exactamente lo que fija
      # package-lock.json y falla si el lock no concuerda con package.json.
      # Con npm install, el CI podía resolver versiones distintas a las de la
      # máquina de quien abrió el PR.
      - run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Pruebas unitarias
        run: npm test --if-present -- --watchAll=false
