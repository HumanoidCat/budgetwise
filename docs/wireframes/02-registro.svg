<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Crear cuenta">
  <title>Crear cuenta</title>
  <rect width="390" height="844" fill="#F5F7FA" />
  <text x="20" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#14181F" text-anchor="start">9:41</text>
  <text x="370" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#5A6474" text-anchor="end">▮▮▮  ▲  ▰</text>
  <text x="20" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#14181F" text-anchor="start">Crear cuenta</text>
  <text x="370" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#2A5BD7" text-anchor="end">Cancelar</text>
  <text x="20" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#5A6474" text-anchor="start">Se crean nueve categorías para empezar.</text>
  <text x="20" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#5A6474" text-anchor="start">Nombre</text>
  <rect x="20" y="148" width="350" height="48" fill="#FFFFFF" rx="10" stroke="#868D99" stroke-width="1" />
  <text x="34" y="177.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#14181F" text-anchor="start">Avril Madrigal</text>
  <text x="20" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#5A6474" text-anchor="start">Correo</text>
  <rect x="20" y="226" width="350" height="48" fill="#FFFFFF" rx="10" stroke="#868D99" stroke-width="1" />
  <text x="34" y="255.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#14181F" text-anchor="start">avril@correo.com</text>
  <text x="20" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#5A6474" text-anchor="start">Contraseña</text>
  <rect x="20" y="304" width="350" height="48" fill="#FFFFFF" rx="10" stroke="#868D99" stroke-width="1" />
  <text x="34" y="333.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#14181F" text-anchor="start">••••••••••</text>
  <text x="20" y="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#5A6474" text-anchor="start">Mínimo 8 caracteres.</text>
  <rect x="20" y="398" width="350" height="52" fill="#2A5BD7" rx="12" />
  <text x="195.0" y="430.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Crear cuenta</text>
  <text x="195.0" y="484" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#2A5BD7" text-anchor="middle">¿Ya tenés cuenta? Iniciar sesión</text>
  <rect x="20" y="516" width="350" height="49" fill="#EAF0FE" rx="6" />
  <text x="28" y="531" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#2A5BD7" text-anchor="start">Validación en el cliente antes de llamar al API: formato de</text>
  <text x="28" y="544" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#2A5BD7" text-anchor="start">correo y contraseña de 8 caracteres o más. El botón queda</text>
  <text x="28" y="557" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#2A5BD7" text-anchor="start">inactivo mientras algo no cumpla.</text>
