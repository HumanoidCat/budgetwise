; Configuración de Alembic — BudgetWise (S0-6)
; La URL de la base la inyecta alembic/env.py desde DATABASE_URL, no se escribe acá.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

; Las migraciones se nombran 0001_..., 0002_..., para que el orden sea legible.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
