services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: budgetwise
      POSTGRES_PASSWORD: budgetwise
      POSTGRES_DB: budgetwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://budgetwise:budgetwise@db:5432/budgetwise
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
