# Blueprint de Render — HU-18: backend + PostgreSQL para la demo
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: budgetwise-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: budgetwise-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ENVIRONMENT
        value: production

databases:
  - name: budgetwise-db
    plan: free
    region: oregon
    databaseName: budgetwise
    user: budgetwise
