# Credenciales para la exploración local con k3d (HU-17).
# En un entorno real esto NUNCA se commitea: se crea con `kubectl create secret`
# o con un gestor de secretos. Aquí va en claro porque es un clúster local
# desechable con datos de prueba — y ese contraste es parte de lo que se explica
# en la presentación.
apiVersion: v1
kind: Secret
metadata:
  name: budgetwise-secrets
  namespace: budgetwise
type: Opaque
stringData:
  POSTGRES_USER: budgetwise
  POSTGRES_PASSWORD: budgetwise
  POSTGRES_DB: budgetwise
  DATABASE_URL: postgresql://budgetwise:budgetwise@postgres:5432/budgetwise
  SECRET_KEY: clave-solo-para-el-cluster-local-k3d
